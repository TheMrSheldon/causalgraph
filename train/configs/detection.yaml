# Step 1 — Causality Detection
# Lighter model (roberta-base); recall is the primary metric since false negatives
# (missed causal posts) are more costly than false positives.
# Dataset: CNC causality-detection (3075 train, 340 dev)
trainer:
  max_epochs: 5
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  gradient_clip_val: 1.0
  val_check_interval: 0.5
  log_every_n_steps: 20
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: clear27-rscience-corpus
      entity: causenet
      name: detection-roberta-base
      log_model: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/f1
        mode: max
        save_top_k: 1
        filename: detection-{epoch:02d}-f1{val/f1:.3f}
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/f1
        mode: max
        patience: 3
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

model:
  class_path: train.models.detection.CausalityDetectionModule
  init_args:
    model_name: roberta-base
    learning_rate: 3e-5
    weight_decay: 0.01
    warmup_steps: 100
    pos_weight: 1.0

data:
  class_path: train.data.detection.CausalityDetectionDataModule
  init_args:
    train_path: train/datasets/countercausal-news-corpus/causality-detection/train.jsonl
    val_path: train/datasets/countercausal-news-corpus/causality-detection/dev.jsonl
    model_name: roberta-base
    max_length: 128
    batch_size: 128
    num_workers: 4
